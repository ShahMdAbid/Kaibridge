# =============================================================
# AUTO-PLACEMENT CONSTRAINT FILE
# Generated by: abIDE Rule 9B Agent
# Schema Version: 2.0
# =============================================================
# AGENT: Fill every field based on design_rules.md and the
# circuit_blueprint. Do not leave placeholder values.
# =============================================================

meta:
  board_name: "my_project"
  generated_by: "abIDE-agent-v1"
  rule_version: "1.0"
  board_bounds_mm:
    min_x: 50.0
    max_x: 150.0
    min_y: 50.0
    max_y: 150.0

# -----------------------------------------------------------------
# ANCHORS — components placed at exact coordinates or locked to zones
# The physics engine will NOT move these. All others orbit around them.
# -----------------------------------------------------------------
anchors:
  - ref: "J1"                  # USB connector
    zone: "EDGE_TOP"
    position_mm: { x: 100.0, y: 52.0 }   # exact if known, else omit
    locked: true
    rotation_deg: 0
    notes: "USB-C, flush with top edge"

  - ref: "J2"                  # Power jack
    zone: "EDGE_LEFT"
    locked: true
    rotation_deg: 270
    # No position_mm: engine will snap to EDGE_LEFT zone center before locking.
    # If you know the exact position, add: position_mm: { x: ..., y: ... }
    notes: "Barrel jack, power entry"

  - ref: "H1"
    zone: "CORNER_TL"          # Top-left corner
    position_mm: { x: 53.0, y: 53.0 }
    locked: true
    notes: "Mounting hole, M3"

  - ref: "H2"
    zone: "CORNER_TR"
    position_mm: { x: 147.0, y: 53.0 }
    locked: true

  - ref: "H3"
    zone: "CORNER_BL"
    position_mm: { x: 53.0, y: 147.0 }
    locked: true

  - ref: "H4"
    zone: "CORNER_BR"
    position_mm: { x: 147.0, y: 147.0 }
    locked: true

# -----------------------------------------------------------------
# ZONE PREFERENCES — components attracted to a zone but not locked
# The physics engine applies a strong zone-attraction force.
# -----------------------------------------------------------------
zone_preferences:
  - ref: "U1"                  # Main MCU
    zone: "DIGITAL_ZONE"
    rotation_deg: 0
    priority: 10               # Higher = stronger pull to this zone

  - ref: "U2"                  # LDO Regulator
    zone: "EDGE_LEFT"
    rotation_deg: 0
    priority: 9

  - ref: "U3"                  # Op-Amp
    zone: "ANALOG_ZONE"
    priority: 8

  - ref: "C5"                  # Bulk cap 100uF
    zone: "EDGE_LEFT"
    priority: 7

# -----------------------------------------------------------------
# TIGHT GROUPS — components that must stay within max_dist_mm of
# their anchor_ref. The physics engine uses strong spring attraction.
# -----------------------------------------------------------------
tight_groups:
  - group_id: "mcu_decoupling"
    anchor_ref: "U1"           # The MCU is the center of this group
    max_dist_mm: 3.0
    members:
      - ref: "C1"              # 100nF decoupling cap VCC
        rotation_deg: 0
      - ref: "C2"              # 100nF decoupling cap VDD
        rotation_deg: 0
      - ref: "C3"              # 10nF decoupling cap
        rotation_deg: 0

  - group_id: "mcu_crystal"
    anchor_ref: "U1"
    max_dist_mm: 5.0
    keep_clear_radius_mm: 3.0  # No other components inside this radius around Y1
    members:
      - ref: "Y1"              # Crystal
        rotation_deg: 90
      - ref: "C6"              # Crystal load cap
      - ref: "C7"              # Crystal load cap

  - group_id: "ldo_caps"
    anchor_ref: "U2"           # LDO regulator
    max_dist_mm: 4.0
    members:
      - ref: "C4"              # LDO input cap
      - ref: "C8"              # LDO output cap

  - group_id: "sensor_cluster"
    anchor_ref: "U3"
    max_dist_mm: 5.0
    members:
      - ref: "R1"
      - ref: "R2"
      - ref: "C9"

# -----------------------------------------------------------------
# RELATIVE CONSTRAINTS — place component relative to another ref
# Useful for oriented placement without tight grouping.
# -----------------------------------------------------------------
relative_constraints:
  - ref: "LED1"
    relative_to: "R3"          # Current-limiting resistor for LED1
    direction: "right"         # left | right | above | below
    offset_mm: 2.0

  - ref: "SW1"
    relative_to: "J1"
    direction: "below"
    offset_mm: 5.0

# -----------------------------------------------------------------
# KEEP_CLEAR ZONES — define rectangular areas where NO component
# (except the owner) should be placed by the physics engine.
# -----------------------------------------------------------------
keep_clear_zones:
  - owner_ref: "U1"            # MCU thermal area
    margin_mm: 2.0             # Extra clearance beyond courtyard

  - center_mm: { x: 100.0, y: 52.0 }
    radius_mm: 8.0
    label: "USB_connector_clearance"
    notes: "Keep USB differential pair traces clear"

# -----------------------------------------------------------------
# ROTATION OVERRIDES — force specific rotations regardless of physics
# -----------------------------------------------------------------
rotation_overrides:
  - ref: "Q1"
    rotation_deg: 45
    notes: "SOT-23 NPN, collector toward LED load"

  - ref: "U4"
    rotation_deg: 180
    notes: "IC oriented so SPI pins face MCU"

# -----------------------------------------------------------------
# GLOBAL PHYSICS PARAMETERS (override engine defaults per-run)
# -----------------------------------------------------------------
physics_params:
  iterations: 200
  k_spring: 1.2
  k_repulsion: 60.0
  clearance_mm: 1.5
  initial_temp: 12.0
  cooling_rate: 0.97
  velocity_damping: 0.8
  max_displacement_mm: 2.0
  early_stop_mm: 0.05
